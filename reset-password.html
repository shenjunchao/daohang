<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>重置密码</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="reset-page">
    <main class="reset-shell">
      <section class="reset-card">
        <div class="reset-header">
          <div class="reset-title-group">
            <div class="reset-badge" aria-hidden="true">🔒</div>
            <div>
              <p class="reset-eyebrow">PASSWORD RESET</p>
              <h1>重置密码</h1>
            </div>
          </div>
          <a class="reset-back" href="./index.html">返回首页<span aria-hidden="true">›</span></a>
        </div>

        <div class="reset-divider"></div>

        <form class="reset-form" id="resetPasswordForm">
          <div class="reset-section-head">
            <div class="reset-section-icon" aria-hidden="true">✎</div>
            <div>
              <h2>设置新密码</h2>
              <p id="resetPasswordStatus">请从邮箱打开重置链接后，再在这里输入新密码。</p>
            </div>
          </div>

          <label class="password-field">
            <span class="password-field-icon" aria-hidden="true">🔒</span>
            <input id="newPassword" type="password" autocomplete="new-password" placeholder="输入新密码" />
            <button class="password-toggle" type="button" data-target="newPassword" aria-label="显示或隐藏密码">👁</button>
          </label>

          <label class="password-field">
            <span class="password-field-icon" aria-hidden="true">🔒</span>
            <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="再次输入新密码" />
            <button class="password-toggle" type="button" data-target="confirmPassword" aria-label="显示或隐藏密码">👁</button>
          </label>

          <button class="reset-submit" id="resetPasswordSubmit" type="submit">
            <span aria-hidden="true">🛡</span>
            <span>更新密码</span>
          </button>
        </form>

        <div class="reset-note">
          <span class="reset-note-icon" aria-hidden="true">🛡</span>
          <p>为确保账户安全，密码需包含字母、数字，长度不少于 8 位。</p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./reset-password.js"></script>
  </body>
</html>
