<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>公告管理后台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <section class="admin-card">
        <div class="admin-header">
          <div>
            <p class="admin-eyebrow">Announcement Admin</p>
            <h1>公告管理后台</h1>
          </div>
          <a class="admin-back" href="./index.html">返回前台</a>
        </div>

        <form class="admin-auth" id="adminAuthForm">
          <h2>管理员登录</h2>
          <p class="auth-status" id="adminAuthStatus">请先登录管理员账号。</p>
          <input id="adminAuthEmail" type="email" autocomplete="username" placeholder="邮箱地址" />
          <input id="adminAuthPassword" type="password" autocomplete="current-password" placeholder="密码" />
          <div class="site-form-actions">
            <button id="adminLoginButton" type="submit">登录</button>
            <button id="adminLogoutButton" type="button" hidden>退出登录</button>
          </div>
        </form>

        <form class="admin-form" id="announcementAdminForm" hidden>
          <div class="admin-section-head">
            <h2>编辑公告</h2>
            <p id="announcementAdminMeta">登录后可修改公告内容。</p>
          </div>
          <input id="announcementAdminTitle" type="text" placeholder="公告标题，例如：重要提示（一定要看）" />
          <textarea id="announcementAdminContent" rows="14" placeholder="输入公告正文，支持换行显示。"></textarea>
          <div class="site-form-actions">
            <button id="announcementAdminReload" type="button">重新读取</button>
            <button id="announcementAdminSave" type="submit">更新公告</button>
          </div>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./admin.js"></script>
  </body>
</html>
