<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人导航</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top-area">
      <div class="top-title">
        <div class="search-shell">
          <form class="search-card" id="searchForm">
            <input
              id="searchInput"
              type="search"
              autocomplete="off"
              placeholder="输入关键词搜索"
              aria-label="搜索关键词"
            />
            <select id="engineSelect" aria-label="选择搜索引擎"></select>
            <button type="submit" id="searchButton">搜索</button>
          </form>
        </div>
      </div>

      <button class="announcement-trigger" id="announcementTrigger" type="button" aria-haspopup="dialog">
        <span>公告</span>
        <span class="announcement-trigger-icon" aria-hidden="true">🔈</span>
      </button>
    </header>

    <main class="shell">
      <aside class="sidebar-wrap">
        <aside class="sidebar" id="sidebar" aria-label="分类导航"></aside>
      </aside>

      <section class="content">
        <div class="workspace">
          <div class="cards" id="categoryCards"></div>

          <aside class="edit-panel" id="editPanel" aria-label="编辑面板">
            <form class="edit-form" id="categoryForm">
              <h2>添加分类</h2>
              <input id="categoryName" type="text" placeholder="分类名称，例如：工具" />
              <button type="submit">添加分类</button>
            </form>

            <form class="edit-form" id="siteForm">
              <h2>添加网站</h2>
              <select id="siteCategory"></select>
              <input id="siteName" type="text" placeholder="网站名称，例如：百度" />
              <input id="siteUrl" type="url" placeholder="网站地址，例如：https://www.baidu.com" />
              <div class="icon-row">
                <input id="siteIcon" type="text" placeholder="图标文字、emoji 或联网图标地址，可选" />
                <button id="fetchIconButton" type="button">获取</button>
              </div>
              <input id="editingSiteId" type="hidden" />
              <input id="editingSiteCategoryId" type="hidden" />
              <div class="site-form-actions">
                <button id="cancelSiteEditButton" type="button" hidden>取消编辑</button>
                <button id="siteSubmitButton" type="submit">添加网站</button>
              </div>
            </form>

            <form class="edit-form auth-sync-form" id="authForm">
              <h2>账号同步</h2>
              <p class="auth-status auth-status-pill" id="authStatus">未配置 Supabase，当前使用本地数据。</p>
              <input id="authUsername" type="email" autocomplete="username" placeholder="邮箱地址" />
              <input id="authPassword" type="password" autocomplete="current-password" placeholder="密码" />
              <div class="auth-inline-row">
                <button class="inline-link-button" id="forgotPasswordButton" type="button">忘记密码？</button>
              </div>
              <div class="auth-actions">
                <button id="loginButton" type="submit">登录</button>
                <button id="registerButton" type="button">注册</button>
              </div>
              <div class="auth-actions auth-actions-secondary">
                <button id="syncNowButton" type="button">立即同步</button>
                <button id="logoutButton" type="button">退出登录</button>
              </div>
            </form>

          </aside>
        </div>
      </section>

      <div class="toolbar-actions">
        <button class="ghost-button" id="exportButton" type="button">导出</button>
        <label class="ghost-button import-label" for="importInput">导入</label>
        <input id="importInput" type="file" accept="application/json" />
        <button class="primary-button" id="editToggle" type="button">编辑</button>
      </div>
    </main>

    <div class="modal-backdrop" id="announcementModal" hidden>
      <section class="modal-card announcement-modal-card" role="dialog" aria-modal="true" aria-labelledby="announcementModalTitle">
        <div class="announcement-modal-head">
          <div>
            <h2 id="announcementModalTitle">公告</h2>
            <p id="announcementUpdatedAt"></p>
          </div>
          <button class="modal-close" id="announcementModalClose" type="button" aria-label="关闭公告">×</button>
        </div>
        <div class="announcement-modal-body" id="announcementContent"></div>
      </section>
    </div>

    <template id="categoryTemplate">
      <article class="category-card">
        <div class="card-header">
          <div>
            <h2></h2>
            <span></span>
          </div>
          <div class="card-actions">
            <button class="text-button rename-category" type="button">改名</button>
            <button class="text-button danger delete-category" type="button">删除</button>
          </div>
        </div>
        <div class="site-grid"></div>
      </article>
    </template>

    <template id="siteTemplate">
      <div class="site-item">
        <a class="site-link" target="_blank" rel="noreferrer">
          <span class="site-icon"></span>
          <span class="site-title"></span>
        </a>
        <button class="edit-site" type="button" aria-label="编辑网站">✎</button>
        <button class="refresh-site-icon" type="button" aria-label="联网获取图标">↻</button>
        <button class="remove-site" type="button" aria-label="删除网站">×</button>
      </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
