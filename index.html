<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人导航</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top-area">
      <div class="top-title">
        <div>
          <p class="eyebrow" id="eyebrowText">My Navigation</p>
          <h1 id="pageTitle">个人自定义导航</h1>
        </div>
        <div class="toolbar-actions">
          <button class="ghost-button" id="exportButton" type="button">导出</button>
          <label class="ghost-button import-label" for="importInput">导入</label>
          <input id="importInput" type="file" accept="application/json" />
          <button class="primary-button" id="editToggle" type="button">编辑</button>
        </div>
      </div>

      <form class="search-card" id="searchForm">
        <input
          id="searchInput"
          type="search"
          autocomplete="off"
          placeholder="输入关键词搜索"
          aria-label="搜索关键词"
        />
        <select id="engineSelect" aria-label="选择搜索引擎"></select>
        <button type="submit" id="searchButton">搜索</button>
      </form>
    </header>

    <main class="shell">
      <aside class="sidebar" id="sidebar" aria-label="分类导航"></aside>

      <section class="content">
        <div class="workspace">
          <div class="cards" id="categoryCards"></div>

          <aside class="edit-panel" id="editPanel" aria-label="编辑面板">
            <form class="edit-form" id="categoryForm">
              <h2>添加分类</h2>
              <input id="categoryName" type="text" placeholder="分类名称，例如：工具" />
              <button type="submit">添加分类</button>
            </form>

            <form class="edit-form" id="siteForm">
              <h2>添加网站</h2>
              <select id="siteCategory"></select>
              <input id="siteName" type="text" placeholder="网站名称，例如：百度" />
              <input id="siteUrl" type="url" placeholder="网站地址，例如：https://www.baidu.com" />
              <div class="icon-row">
                <input id="siteIcon" type="text" placeholder="图标文字、emoji 或联网图标地址，可选" />
                <button id="fetchIconButton" type="button">获取</button>
              </div>
              <button type="submit">添加网站</button>
            </form>

            <p class="edit-tip">右侧表单可直接使用；点击“编辑”后可拖动网站、调整分类顺序，并显示改名/删除操作。</p>

            <form class="edit-form" id="appearanceForm">
              <h2>页面设置</h2>
              <input id="settingsEyebrow" type="text" placeholder="副标题，例如：My Navigation" />
              <input id="settingsTitle" type="text" placeholder="主标题，例如：个人自定义导航" />
              <button type="submit">保存页面设置</button>
            </form>

            <form class="edit-form" id="authForm">
              <h2>账号同步</h2>
              <p class="auth-status" id="authStatus">未配置 Supabase，当前使用本地数据。</p>
              <input id="authUsername" type="email" autocomplete="username" placeholder="邮箱地址" />
              <input id="authPassword" type="password" autocomplete="current-password" placeholder="密码" />
              <div class="auth-actions">
                <button id="loginButton" type="submit">登录</button>
                <button id="registerButton" type="button">注册</button>
              </div>
              <div class="auth-actions auth-actions-secondary">
                <button id="syncNowButton" type="button">立即同步</button>
                <button id="logoutButton" type="button">退出登录</button>
              </div>
            </form>
          </aside>
        </div>
      </section>
    </main>

    <template id="categoryTemplate">
      <article class="category-card">
        <div class="card-header">
          <div>
            <h2></h2>
            <span></span>
          </div>
          <div class="card-actions">
            <button class="text-button rename-category" type="button">改名</button>
            <button class="text-button danger delete-category" type="button">删除</button>
          </div>
        </div>
        <div class="site-grid"></div>
      </article>
    </template>

    <template id="siteTemplate">
      <div class="site-item">
        <a class="site-link" target="_blank" rel="noreferrer">
          <span class="site-icon"></span>
          <span class="site-title"></span>
        </a>
        <button class="refresh-site-icon" type="button" aria-label="联网获取图标">↻</button>
        <button class="remove-site" type="button" aria-label="删除网站">×</button>
      </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
